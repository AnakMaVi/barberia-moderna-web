<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva tu Cita | BARBER KING</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">✂️ BARBER KING</div>
    <nav>
      <a href="index.html">Volver a Inicio</a>
    </nav>
  </header>

  <main class="booking-container">
    <div class="booking-card">
      <h2>📅 Agenda tu Cita Previa</h2>
      <form id="booking-form">
        <div class="form-group">
          <label>Nombre Completo:</label>
          <input type="text" id="nombre" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Teléfono:</label>
          <input type="tel" id="telefono" required placeholder="+34 600 000 000">
        </div>
        <div class="form-group">
          <label>Selecciona Servicio:</label>
          <select id="servicio" required>
            <option value="Fade / Degradado - 20€">Fade / Degradado (20€)</option>
            <option value="Corte Clásico - 18€">Corte Clásico (18€)</option>
            <option value="Arreglo de Barba - 15€">Arreglo de Barba (15€)</option>
            <option value="Combo King - 30€">Combo King (Corte + Barba) (30€)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha:</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
          <label>Hora:</label>
          <input type="time" id="hora" required>
        </div>
        <button type="submit" class="btn-submit">Confirmar Reserva</button>
      </form>
      <div id="confirmation-msg" class="hidden"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
